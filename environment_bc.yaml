# Environment for the behavior-cloning (human proxy) partners, which were trained with
# TensorFlow 1 / stable-baselines. LLM backbones are not loaded in BC-vs-RL runs.
name: causalplan_bc
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.7.16
  - pip=22.3.1
  - mpi4py=3.1.4
  - pip:
    - tensorflow==1.13.1
    - torch==1.13.1
    - numpy==1.21.6
    - gym==0.26.2
    - tqdm
    - rich==13.5.2
    - importlib_metadata
    - protobuf==3.20.3
